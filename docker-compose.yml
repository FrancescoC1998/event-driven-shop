name: shop

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL: un'unica istanza che ospita un database per ogni microservizio.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17
    container_name: shop-postgres
    environment:
      # Superutente dell'istanza (usato solo per l'amministrazione)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Credenziali dei singoli servizi, usate dallo script di init
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Volume con nome: i dati sopravvivono a "down" e ai riavvii
      - pgdata:/var/lib/postgresql/data
      # Gli script in questa cartella girano SOLO al primo avvio (volume vuoto)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Kafka in modalità KRaft: lo stesso processo fa da broker e da controller,
  # senza Zookeeper.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.2
    container_name: shop-kafka
    ports:
      # Solo il listener EXTERNAL è esposto al tuo PC
      - "${KAFKA_EXTERNAL_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Su quali porte Kafka ascolta DENTRO il container:
      #   INTERNAL   -> per gli altri container (kafka-ui, e più avanti i servizi dockerizzati)
      #   EXTERNAL   -> per le applicazioni lanciate sul tuo PC (es. da IntelliJ)
      #   CONTROLLER -> traffico interno del quorum KRaft
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      # Quale indirizzo Kafka comunica ai client dopo la prima connessione.
      # Dentro Docker il nome "kafka" è risolvibile; dal tuo PC no, lì serve "localhost".
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Un solo broker: impossibile replicare, quindi replication factor = 1
      # (in produzione tipicamente 3)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Scelta didattica: i topic li creeremo esplicitamente dal codice
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Dove Kafka salva i dati: deve coincidere con il volume montato sotto,
      # altrimenti (default /tmp/kraft-combined-logs) topic e messaggi si perdono a ogni "down"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Kafka UI (fork mantenuto "kafbat"): interfaccia web per topic, messaggi,
  # consumer group e offset.  ->  http://localhost:${KAFKA_UI_PORT}
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: shop-kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Gira dentro Docker -> usa il listener INTERNAL
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Flyway CLI: applica le migrazioni SQL senza bisogno dei servizi Java.
  # Usa gli STESSI file che più avanti userà Spring Boot: quando i servizi
  # partiranno, Flyway vedrà in flyway_schema_history che sono già applicati.
  #
  # Profilo "migrate": NON partono con "docker compose up", si lanciano a mano:
  #   docker compose run --rm flyway-inventory           (migrate)
  #   docker compose run --rm flyway-inventory info      (stato delle migrazioni)
  #   docker compose run --rm flyway-orders              (migrate)
  # ---------------------------------------------------------------------------
  flyway-inventory:
    image: flyway/flyway:13.11.1-alpine
    profiles: ["migrate"]
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/inventory_db
      FLYWAY_USER: inventory_user
      FLYWAY_PASSWORD: ${INVENTORY_DB_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./inventory-service/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  flyway-orders:
    image: flyway/flyway:13.11.1-alpine
    profiles: ["migrate"]
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/orders_db
      FLYWAY_USER: orders_user
      FLYWAY_PASSWORD: ${ORDERS_DB_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./order-service/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Microservizi (profilo "apps"): immagini costruite dal nostro codice.
  # Non partono con un semplice `docker compose up -d`, così durante lo sviluppo
  # puoi avviarli da IntelliJ senza conflitti sulla porta. Per avviarli in Docker:
  #   docker compose --profile apps up -d --build
  # ---------------------------------------------------------------------------
  inventory-service:
    build:
      context: .                                # root del repo: servono POM parent e mvnw
      dockerfile: inventory-service/Dockerfile
    image: shop/inventory-service:latest
    container_name: shop-inventory-service
    profiles: ["apps"]
    ports:
      - "8081:8081"
      - "5005:5005"   # debug remoto (IntelliJ: Remote JVM Debug su localhost:5005)
    environment:
      # Dentro la rete Docker il database si chiama "postgres", non "localhost"
      DB_HOST: postgres
      DB_PORT: 5432
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      # Agente di debug JDWP: la JVM legge JAVA_TOOL_OPTIONS all'avvio.
      # suspend=n -> parte senza aspettare il debugger. Solo per sviluppo, mai in produzione.
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  kafkadata:
